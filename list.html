<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lista Comenzi</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#f1f3f7;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e3a8a;
    color:white;
    padding:15px 30px;
}

.logo{
    font-weight:bold;
    font-size:18px;
}

.back-btn{
    background:white;
    color:#1e3a8a;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

.container{
    padding:30px 60px;
}

.filter-bar{
    margin-bottom:20px;
    display:flex;
    gap:15px;
}

input,select,textarea{
    padding:8px 10px;
    border-radius:6px;
    border:1px solid #ccc;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

th{
    background:#2c3e90;
    color:white;
    padding:14px;
    text-align:left;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f8f9fc;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    color:white;
    cursor:pointer;
}

.status.Noua{
    background:#f39c12;
}

.status.InProgress{
    background:#3498db;
}

.status.Done{
    background:#2ecc71;
}

.download-btn{
    background:#3498db;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
}

.product-cell{
    cursor:pointer;
    color:#1e40af;
    font-weight:500;
}

.product-cell:hover{
    text-decoration:underline;
}

.autosave{
    font-size:11px;
    color:#16a34a;
    margin-top:4px;
}

</style>
</head>

<body onload="requireAuth(); loadOrders();">

<div class="topbar">

<div class="logo">
📦 Sistem Comenzi
</div>

<button
class="back-btn"
onclick="location.href='dashboard.html'">

⬅ Înapoi

</button>

</div>

<div class="container">

<div class="filter-bar">

<input
type="text"
id="search"
placeholder="Caută client / produs"
onkeyup="filterOrders()">

<select
id="statusFilter"
onchange="filterOrders()">

<option value="">Toate</option>
<option value="Noua">Noua</option>
<option value="InProgress">InProgress</option>
<option value="Done">Done</option>

</select>

</div>

<div id="lista"></div>

</div>

<script src="config.js?v=2"></script>
<script>

let allOrders = [];

function esc(s){
    if (s === null || s === undefined) return "";
    return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
}

async function loadOrders(){
    try {
        const res = await fetch(API_BASE + "/list.php", {
            headers: { "X-Token": authToken() }
        });
        if (res.status === 401) { clearToken(); location.href = "index.html"; return; }
        const data = await res.json();
        allOrders = data || [];
        renderOrders(allOrders);
    } catch (e) {
        alert("Eroare la incarcare: " + e.message);
    }
}

function formatDate(date){
    if(!date) return "-";
    return new Date(String(date).replace(" ","T")).toLocaleString("ro-RO");
}

function normalizeStatus(status){
    return status || "Noua";
}

function get3DViewerLink(url){
    if (!url) return null;
    return `https://3dviewer.net/#model=${url}`;
}

function renderOrders(data){

let html = `
<table>
<tr>
<th>Data</th>
<th>Client</th>
<th>Produs</th>
<th>Cantitate</th>
<th>Status</th>
<th>Pret</th>
<th>Coment</th>
<th>Fisier</th>
</tr>
`;

data.forEach(c => {

const publicUrl = fileUrl(c.file_url || c.file_path || "");
const viewerLink = get3DViewerLink(publicUrl);
const hasFile = !!publicUrl;

html += `
<tr>
<td>${formatDate(c.data_comanda)}</td>
<td>${esc(c.client)}</td>
<td class="product-cell" ondblclick="open3DViewer('${viewerLink || ''}')">
${esc(c.produs)} ${hasFile ? ' 👁️ 3D' : ''}
</td>
<td>${esc(c.cantitate)}</td>
<td>
<span class="status ${normalizeStatus(c.status)}"
      onclick="editStatus(${c.id})" id="badge_${c.id}">
${esc(c.status ?? "Noua")}
</span>
<select id="status_${c.id}" style="display:none" onchange="changeStatus(${c.id})">
<option value="Noua">Noua</option>
<option value="InProgress">InProgress</option>
<option value="Done">Done</option>
</select>
</td>
<td>
<input type="number" id="pret_${c.id}" value="${esc(c.pret ?? '')}"
       style="width:90px" onchange="updateOrder(${c.id})">
</td>
<td>
<textarea id="coment_${c.id}" style="width:160px;height:45px"
          onchange="updateOrder(${c.id})">${esc(c.coment ?? '')}</textarea>
<div id="saved_${c.id}" class="autosave"></div>
</td>
<td>
${hasFile
  ? `<button class="download-btn" onclick="window.open('${publicUrl}','_blank')">Descarcă</button>`
  : "-"}
</td>
</tr>
`;

});

html += "</table>";
document.getElementById("lista").innerHTML = html;
}

function editStatus(id){
    const badge = document.getElementById("badge_"+id);
    const select = document.getElementById("status_"+id);
    select.value = badge.innerText.trim() || "Noua";
    badge.style.display = "none";
    select.style.display = "inline-block";
    select.focus();
}

function changeStatus(id){
    const select = document.getElementById("status_"+id);
    const badge = document.getElementById("badge_"+id);
    const status = select.value;
    badge.innerText = status;
    badge.className = "status " + normalizeStatus(status);
    select.style.display = "none";
    badge.style.display = "inline-block";
    updateOrder(id);
}

function filterOrders(){
    const search = document.getElementById("search").value.toLowerCase();
    const status = document.getElementById("statusFilter").value;
    const filtered = allOrders.filter(o => {
        const matchSearch =
            (o.client && o.client.toLowerCase().includes(search)) ||
            (o.produs && o.produs.toLowerCase().includes(search));
        const matchStatus = !status || o.status === status;
        return matchSearch && matchStatus;
    });
    renderOrders(filtered);
}

async function updateOrder(id){
    const select = document.getElementById("status_"+id);
    const badge = document.getElementById("badge_"+id);
    let status = "Noua";
    if (select && select.style.display === "inline-block") status = select.value;
    else if (badge) status = badge.innerText.trim();

    let pret = document.getElementById("pret_"+id)?.value;
    let coment = document.getElementById("coment_"+id)?.value;
    if (pret === "") pret = null;
    if (coment === "") coment = null;

    const saved = document.getElementById("saved_"+id);
    if (saved) saved.innerHTML = "💾 Salvare...";

    try {
        const res = await fetch(API_BASE + "/update.php", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Token": authToken() },
            body: JSON.stringify({ id: Number(id), status, pret, coment })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "eroare");
        if (saved) {
            saved.innerHTML = "✅ Salvat automat";
            setTimeout(() => (saved.innerHTML = ""), 2000);
        }
    } catch (e) {
        if (saved) saved.innerHTML = "❌ Eroare";
    }
}

function open3DViewer(viewerLink){
    if (!viewerLink) { alert("Nu există link valid pentru vizualizare 3D!"); return; }
    window.open(viewerLink, '_blank');
}

</script>

</body>
</html>
